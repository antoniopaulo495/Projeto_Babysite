<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Localização | Babysite</title>
  <link rel="icon" href="../../../../imagens/logo_do_babysite.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../../css/cadastro/cadastro.css">
  <link rel="stylesheet" href="../../../../css/cadastro/baba/endereco/endereco.css">
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm p-4 p-md-5">
          <p class="eyebrow">CADASTRO DA BABÁ · 4 DE 8</p>
          <h1 class="h2 fw-bold">Sua localização</h1>
          <p class="text-secondary mb-4">Informe seu estado e município. Esses dados ajudam as famílias a encontrar profissionais na região.</p>
          <form id="sitterAddressForm" class="row g-3">
            <div class="col-12">
              <label class="form-label" for="estado">Estado</label>
              <select class="form-select" id="estado" name="estado" autocomplete="address-level1" required>
                <option value="">Selecione o estado</option>
                <option value="ESTADO_1">estado_1</option><option value="ESTADO_2">estado_2</option><option value="ESTADO_3">estado_3</option>
                <option value="ESTADO_4">estado_4</option><option value="ESTADO_5">estado_5</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="municipio">Município</label>
              <input class="form-control" id="municipio" name="municipio" list="municipiosSugeridos" autocomplete="address-level2" maxlength="100" required>
              <datalist id="municipiosSugeridos"></datalist>
            </div>
            <p class="text-danger small mb-0" id="addressError" role="alert"></p>
            <div class="col-12 d-flex justify-content-between mt-3">
              <a class="btn btn-link" href="../diploma/diploma.html">Voltar</a>
              <button class="btn btn-primary px-4" type="submit">Continuar <span>&#8594;</span></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="../../../../js/cadastro/baba/endereco/endereco.js"></script>
</body>
</html>
