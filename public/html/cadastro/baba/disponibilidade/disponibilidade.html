<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dias habituais | Babysite</title>
  <link rel="icon" href="../../../../imagens/logo_do_babysite.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../../css/cadastro/cadastro.css">
  <link rel="stylesheet" href="../../../../css/cadastro/baba/disponibilidade/disponibilidade.css">
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm p-4 p-md-5">
          <p class="eyebrow">CADASTRO DA BABÁ · 5 DE 7</p>
          <h1 class="h2 fw-bold">Seus dias habituais de trabalho</h1>
          <p class="text-secondary mb-4">Informe pelo menos um dia e o horário em que costuma trabalhar. Essas informações ajudam as famílias a conhecer sua rotina antes de conversar com você.</p>
          <form id="registrationAvailabilityForm" class="profile-form full">
            <fieldset class="availability-field wide">
              <legend>Selecione os dias e horários habituais</legend>
              <div class="availability-list">
                <label class="availability-row"><input type="checkbox" data-availability-day="segunda"><span>Segunda-feira</span><input type="time" data-start-time aria-label="Início na segunda-feira" disabled><span>até</span><input type="time" data-end-time aria-label="Fim na segunda-feira" disabled></label>
                <label class="availability-row"><input type="checkbox" data-availability-day="terca"><span>Terça-feira</span><input type="time" data-start-time aria-label="Início na terça-feira" disabled><span>até</span><input type="time" data-end-time aria-label="Fim na terça-feira" disabled></label>
                <label class="availability-row"><input type="checkbox" data-availability-day="quarta"><span>Quarta-feira</span><input type="time" data-start-time aria-label="Início na quarta-feira" disabled><span>até</span><input type="time" data-end-time aria-label="Fim na quarta-feira" disabled></label>
                <label class="availability-row"><input type="checkbox" data-availability-day="quinta"><span>Quinta-feira</span><input type="time" data-start-time aria-label="Início na quinta-feira" disabled><span>até</span><input type="time" data-end-time aria-label="Fim na quinta-feira" disabled></label>
                <label class="availability-row"><input type="checkbox" data-availability-day="sexta"><span>Sexta-feira</span><input type="time" data-start-time aria-label="Início na sexta-feira" disabled><span>até</span><input type="time" data-end-time aria-label="Fim na sexta-feira" disabled></label>
                <label class="availability-row"><input type="checkbox" data-availability-day="sabado"><span>Sábado</span><input type="time" data-start-time aria-label="Início no sábado" disabled><span>até</span><input type="time" data-end-time aria-label="Fim no sábado" disabled></label>
              </div>
            </fieldset>
            <p class="availability-error wide" id="availabilityError" role="alert"></p>
            <div class="d-flex justify-content-between mt-4">
              <a class="btn btn-link" href="../perfil/perfil.html">Voltar</a>
              <button class="btn btn-primary px-4" id="continueButton" type="submit">Continuar <span>&#8594;</span></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="../../../../js/cadastro/baba/disponibilidade/cadastro-disponibilidade.js"></script>
</body>
</html>
