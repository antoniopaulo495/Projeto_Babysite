<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babysite | Acesso administrativo</title>
  <link rel="icon" href="../../../public/imagens/logo_do_babysite.png" type="image/png">
  <link rel="stylesheet" href="../../css/admin/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" href="../../../public/html/home/home.html">
      <span class="brand-mark"><img src="../../../public/imagens/logo_do_babysite.png" alt=""></span>
      <span><strong>baby</strong>site<small>painel administrativo</small></span>
    </a>
    <p class="eyebrow">ACESSO RESTRITO</p>
    <h1>Bem-vindo de volta.</h1>
    <p class="muted">Entre com a conta administrativa da empresa.</p>
    <form id="adminLoginForm">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" value="admin@babysite.com" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" value="Admin@123" autocomplete="current-password" required>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <button class="primary-button login-submit" type="submit">Entrar no painel</button>
    </form>
    <aside class="starter-account">
      <strong>Conta inicial já cadastrada pela empresa</strong>
      <span>E-mail: admin@babysite.com</span>
      <span>Senha: Admin@123</span>
    </aside>
    <a class="login-back" href="../../../public/html/home/home.html">← Voltar para o Babysite</a>
  </main>
  <script src="../../js/admin/login.js"></script>
</body>
</html>
